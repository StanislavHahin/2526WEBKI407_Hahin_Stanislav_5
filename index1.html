<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP32 Control Panel</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background: linear-gradient(120deg,#141e30,#243b55);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.card{

    background:#1f2937;
    padding:35px;
    border-radius:18px;
    width:380px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.6);

}

h1{
    margin-bottom:10px;
    color:#4fc3f7;
}

.status{

    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#263238;

}

.label{

    color:#90caf9;
}

.footer{

    margin-top:25px;
    font-size:13px;
    opacity:0.6;

}

</style>

</head>

<body>

<div class="card">

<h1>Embedded Web Panel</h1>

<div class="status">
<p class="label">Контролер</p>
<p>ESP32 Development Board</p>
</div>

<div class="status">
<p class="label">Статус системи</p>
<p>Server Running</p>
</div>

<div class="status">
<p class="label">Файлова система</p>
<p>LittleFS Storage</p>
</div>

<div class="footer">
Laboratory project • Гагін С.Я
</div>

</div>

</body>
</html>
