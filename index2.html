<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP32 Web Control</title>

<style>

body{
    background:#0d0d1a; /* темніший фон */
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#121530;
    padding:30px;
    border-radius:30px; /* більш закруглені кути */
    text-align:center;
    width:320px;
    box-shadow: 0 10px 30px rgba(0,255,255,0.2);
}

h1{
    color:#00ffe0; /* яскраво-бірюзовий */
    text-shadow: 0 0 10px #00ffe0;
}

.led{
    width:90px;
    height:50px; /* еліпс */
    border-radius:50px/25px; /* еліпс */
    margin:25px auto;
    background: #1a1a2e;
    transition: all 0.4s ease;
    box-shadow: inset 0 0 10px #000;
}

.led.active{
    background: linear-gradient(45deg, #ff00ff, #00ffff);
    box-shadow: 0 0 25px #ff00ff, 0 0 25px #00ffff inset;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:10px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    font-size:1rem;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,255,255,0.3);
}

.on{
    background: linear-gradient(to right, #00ff99, #00ccff);
    color:white;
}

.off{
    background: linear-gradient(to right, #ff4d4d, #ff0000);
    color:white;
}

button:hover{
    transform: scale(1.05);
}

.info{
    font-size:13px;
    margin-top:15px;
    opacity:0.7;
    color:#00ffe0;
}

</style>

</head>

<body>

<div class="card">

<h1>ESP32 Control</h1>

<div id="led" class="led"></div>

<div class="buttons">

<button class="on" onclick="sendCmd('on')">ON</button>
<button class="off" onclick="sendCmd('off')">OFF</button>

</div>

<div class="info">
IoT Control Panel
</div>

</div>

<script>

const led = document.getElementById("led");

async function update(){
    try{
        const res = await fetch("/api/status");
        const data = await res.json();

        if(data.state){
            led.classList.add("active");
        }else{
            led.classList.remove("active");
        }

    }catch(e){
        console.log("error");
    }
}

async function sendCmd(cmd){
    await fetch("/api/control",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({cmd:cmd})
    });
    update();
}

setInterval(update,2000);
update();

</script>

</body>
</html>
